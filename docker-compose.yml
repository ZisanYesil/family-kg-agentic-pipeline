services:
  # FastAPI REST API for creating extraction jobs, checking status, and retrieving graphs.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: family-kg-agentic-pipeline:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kg-network

  # Celery worker that runs the async agentic extraction and validation pipeline.
  worker:
    image: family-kg-agentic-pipeline:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "celery -A celery_app worker --loglevel=$${LOG_LEVEL:-INFO} --concurrency=4"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
    networks:
      - kg-network

  # Redis broker and result backend for Celery; persistence is intentionally disabled.
  redis:
    image: redis:7-alpine
    networks:
      - kg-network

networks:
  kg-network:
    name: kg-network
